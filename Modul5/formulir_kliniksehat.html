<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran Klinik Sehat</title>
</head>
<body>
    <h1>Formulir Pendaftaran Pasien Klinik Sehat</h1>
    
    <form action="#" method="post">
        <fieldset>
            <legend>Data Pasien</legend>
            <label for="nama_pasien">Nama Lengkap:</label>
            <input type="text" id="nama_pasien" name="nama_pasien" required>
            <br><br>
            <label for="tgl_lahir">Tanggal Lahir:</label>
            <input type="date" id="tgl_lahir" name="tgl_lahir">
            <br><br>
            <label for="no_bpjs">No. BPJS (jika ada):</label>
            <input type="text" id="no_bpjs" name="no_bpjs">
        </fieldset>
        
        <fieldset>
            <legend>Poli Tujuan</legend>
            <label>Pilih Poli:</label><br>
            <input type="radio" id="umum" name="poli" value="umum">
            <label for="umum">Poli Umum</label><br>
            <input type="radio" id="gigi" name="poli" value="gigi">
            <label for="gigi">Poli Gigi</label><br>
            <input type="radio" id="anak" name="poli" value="anak">
            <label for="anak">Poli Anak</label><br>
            <input type="radio" id="kandungan" name="poli" value="kandungan">
            <label for="kandungan">Poli Kandungan</label>
        </fieldset>
        
        <fieldset>
            <legend>Keluhan Pasien</legend>
            <label for="keluhan">Deskripsi Keluhan:</label><br>
            <textarea id="keluhan" name="keluhan" rows="4" cols="50" 
                      placeholder="Jelaskan keluhan Anda secara detail..."></textarea>
            <br><br>
            <label>Gejala yang dirasakan:</label><br>
            <input type="checkbox" id="demam" name="gejala[]" value="demam">
            <label for="demam">Demam</label>
            <input type="checkbox" id="pusing" name="gejala[]" value="pusing">
            <label for="pusing">Pusing</label>
            <input type="checkbox" id="mual" name="gejala[]" value="mual">
            <label for="mual">Mual</label>
            <input type="checkbox" id="batuk" name="gejala[]" value="batuk">
            <label for="batuk">Batuk</label>
        </fieldset>
        
        <fieldset>
            <legend>Jadwal Kunjungan</legend>
            <label for="tanggal">Tanggal Periksa:</label>
            <input type="date" id="tanggal" name="tanggal" required>
            <br><br>
            <label for="waktu">Pilih Waktu:</label>
            <select id="waktu" name="waktu">
                <option value="08:00">08:00 - 09:00</option>
                <option value="09:00">09:00 - 10:00</option>
                <option value="10:00">10:00 - 11:00</option>
                <option value="13:00">13:00 - 14:00</option>
                <option value="14:00">14:00 - 15:00</option>
            </select>
        </fieldset>
        
        <br>
        <input type="submit" value="Daftar Sekarang">
        <input type="reset" value="Reset Formulir">
    </form>
</body>
</html>
