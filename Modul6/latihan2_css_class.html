<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 6 - Latihan 2: CSS Class</title>
    <style>
        p.error {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Contoh Penggunaan CSS Class</h2>
    <p>Ini paragraph normal.</p>
    <p class="error">Ini paragraph dengan class error.</p>
    <p>Ini paragraph normal lagi.</p>
    <p class="error">Ini paragraph dengan class error juga.</p>
</body>
</html>
