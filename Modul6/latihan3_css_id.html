<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul 6 - Latihan 3: CSS ID</title>
    <style>
        p#p01 {
            color: blue;
            font-size: 20px;
            font-style: italic;
        }
        
        table#t01 {
            width: 100%;
            background-color: #f1f1c1;
            border-collapse: collapse;
        }
        
        table#t01 th, table#t01 td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <h2>Contoh Penggunaan CSS ID</h2>
    <p>Ini paragraph standar.</p>
    <p>Ini paragraph standar juga.</p>
    <p id="p01">Ini paragraph dengan ID p01 (styling khusus).</p>
    
    <h3>Tabel dengan ID t01</h3>
    <table id="t01">
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Rusi</td>
            <td>Anandic</td>
            <td>17</td>
        </tr>
    </table>
</body>
</html>
