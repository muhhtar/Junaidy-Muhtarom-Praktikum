<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Modul 13 - Update & Delete Data</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8E2DE2, #4A00E0);
            padding: 40px;
            color: #333;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #4A00E0;
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 3px solid #8E2DE2;
            font-size: 2.5rem;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        .feature-box {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .feature-box:hover {
            border-color: #4A00E0;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(74, 0, 224, 0.1);
        }
        .feature-icon {
            font-size: 2.5rem;
            color: #4A00E0;
            margin-bottom: 15px;
        }
        .feature-box h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #4A00E0;
            color: white;
            padding: 14px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin: 10px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #8E2DE2;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(142, 45, 226, 0.3);
        }
        .file-list {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
        }
        .file-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .file-icon {
            color: #4A00E0;
            font-size: 1.2rem;
        }
        @media (max-width: 768px) {
            .features {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
