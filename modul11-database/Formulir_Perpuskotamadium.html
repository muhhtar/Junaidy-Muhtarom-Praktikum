<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Perpustakaan Madium</title>
    <style>
        body { font-family: Arial; padding: 30px; background: #f0f8ff; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 800px; margin: auto; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn { background: #3498db; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Formulir Peminjaman Buku - Perpustakaan Madium</h1>
        <form>
            <div class="form-group">
                <label>Nama Peminjam:</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>No. Anggota:</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Judul Buku:</label>
                <input type="text" required>
            </div>
            <div class="form-group">
                <label>Kode Buku:</label>
                <input type="text">
            </div>
            <div class="form-group">
                <label>Tanggal Pinjam:</label>
                <input type="date" required>
            </div>
            <div class="form-group">
                <label>Tanggal Kembali:</label>
                <input type="date" required>
            </div>
            <div class="form-group">
                <label>Kategori Buku:</label>
                <select>
                    <option>Teknologi</option>
                    <option>Sains</option>
                    <option>Novel</option>
                    <option>Pelajaran</option>
                </select>
            </div>
            <button type="submit" class="btn">Ajukan Peminjaman</button>
        </form>
        <p style="margin-top: 20px; text-align: center;">
            <a href="tampil_mahasiswa.php">← Kembali ke Modul 11</a>
        </p>
    </div>
</body>
</html>
